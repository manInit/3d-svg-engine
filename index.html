<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D SVG engine demo</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        color: #fff;
        background: #000;
      }
      #backdrop,
      #world {
        position: fixed;
        inset: 0;
      }
      #world {
        z-index: 1;
        cursor: crosshair;
      }
      #backdrop {
        z-index: 0;
        transition: background 0.6s;
      }
      #sun {
        display: none;
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(46vh, 60vw);
        aspect-ratio: 1;
        transform: translate(-50%, -78%);
        border-radius: 50%;
        background: linear-gradient(#ffd319 10%, #ff901f 45%, #ff2975 80%);
        /* горизонтальные прорези, как на обложках synthwave */
        mask: linear-gradient(
          #000 0 52%,
          transparent 52% 55%,
          #000 55% 62%,
          transparent 62% 66%,
          #000 66% 72%,
          transparent 72% 77%,
          #000 77% 82%,
          transparent 82% 88%,
          #000 88% 91%,
          transparent 91%
        );
        filter: drop-shadow(0 0 40px #ff2975);
      }
      body[data-scene='synthwave'] #sun {
        display: block;
      }

      header {
        position: fixed;
        z-index: 2;
        top: 16px;
        left: 16px;
        right: 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        pointer-events: none;
      }
      header > * {
        pointer-events: auto;
      }
      h1 {
        margin: 0 8px 0 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-shadow: 0 1px 4px #0008;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 4px;
        border-radius: 10px;
        background: #0006;
        backdrop-filter: blur(8px);
      }
      button {
        font: inherit;
        font-size: 13px;
        color: #fff;
        background: transparent;
        border: 0;
        border-radius: 7px;
        padding: 6px 12px;
        cursor: pointer;
      }
      button:hover {
        background: #ffffff1f;
      }
      button[aria-pressed='true'] {
        background: #fff;
        color: #111;
      }
      .spacer {
        flex: 1;
      }
      footer {
        position: fixed;
        z-index: 2;
        left: 16px;
        right: 16px;
        bottom: 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        justify-content: space-between;
        font-size: 12px;
        opacity: 0.85;
        text-shadow: 0 1px 3px #000a;
        pointer-events: none;
      }
      #stats {
        font-variant-numeric: tabular-nums;
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body data-scene="lit">
    <div id="backdrop"><div id="sun"></div></div>
    <div id="world"></div>

    <header>
      <h1>3D SVG engine</h1>
      <nav id="scenes">
        <button data-scene="lit">Lighting</button>
        <button data-scene="synthwave">Synthwave</button>
        <button data-scene="teapot">Teapot</button>
        <button data-scene="surfaces">Surfaces</button>
      </nav>
      <span class="spacer"></span>
      <nav>
        <button id="wireframe" aria-pressed="false">Wireframe</button>
        <button id="save">Save as SVG</button>
      </nav>
    </header>

    <footer>
      <span id="hint">Click to fly: mouse + WASD, space / shift — up / down, Esc — release</span>
      <span id="stats"></span>
    </footer>

    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>
